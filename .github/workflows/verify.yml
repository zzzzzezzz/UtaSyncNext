name: verify

# This is the same local gate a developer runs, minus the two checks that need a
# machine-specific environment:
#   network-proxy   expects the Next engine to be installed beside the app
#   preset-catalog  renders with the fonts/ folder, which is not tracked in Git
# Both still run in the full local `--profile health` sweep.
#
# `tools/v3_guard.py` is intentionally not called here: a CI checkout has no v3
# reference beside it, so the guard reports that it has nothing to protect.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-health:
    name: verify_next_stack (health)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ui.txt

      - name: Install launcher dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ui.txt

      - name: Install FFmpeg and FFprobe
        run: choco install ffmpeg -y --no-progress

      - name: Secret and launcher boundary checks
        run: |
          python tools/check_no_secrets.py
          python tools/check_launcher_boundary.py

      - name: Verify the Next stack
        run: >-
          python tools/verify_next_stack.py
          --profile health
          --skip network-proxy,preset-catalog
          --json-report test_logs/health.json

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-health-report
          path: test_logs/health.json
          if-no-files-found: ignore
